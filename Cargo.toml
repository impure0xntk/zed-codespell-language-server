# SPDX-License-Identifier: Apache-2.0

[package]
name = "zed-codespell-language-server"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Zed extension for codespell spell checking"
repository = "https://github.com/impure0xntk/zed-codespell-language-server"
authors = ["impure0xntk <impure0xntk@users.noreply.github.com>"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7"
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
