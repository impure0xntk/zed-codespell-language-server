# SPDX-License-Identifier: Apache-2.0

[package]
name = "codespell-lsp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Language server adapter that exposes the codespell spell checker over LSP"
repository = "https://github.com/impure0xntk/zed-codespell-language-server"
authors = ["impure0xntk <impure0xntk@users.noreply.github.com>"]

[[bin]]
name = "codespell-lsp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
globset = "0.4"
lsp-server = "0.7"
lsp-types = "0.95"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
