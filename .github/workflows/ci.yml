name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Format check (extension host)
        run: cargo fmt --all -- --check
      - name: Format check (adapter)
        run: cargo fmt --manifest-path lsp/Cargo.toml -- --check
      - name: Clippy (extension host)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (adapter)
        run: cargo clippy --manifest-path lsp/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install codespell
        run: sudo apt-get update && sudo apt-get install -y codespell
      - name: Test extension host
        run: cargo test
      - name: Test adapter (integration tests use the real codespell binary)
        run: cargo test --manifest-path lsp/Cargo.toml

  build-wasm:
    name: Build extension host (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM component
        run: cargo build --release --target wasm32-wasip2
      - uses: actions/upload-artifact@v4
        with:
          name: codespell-extension-wasm
          path: target/wasm32-wasip2/release/zed_codespell_language_server.wasm
          if-no-files-found: error